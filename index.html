<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>For Sravuu 💗</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="landing-page">


    <!-- =========================================
         BIRTHDAY MUSIC
    ========================================== -->

    <audio id="birthdayMusic"
           loop
           preload="auto">

        <source src="music/birthday.mp3"
                type="audio/mpeg">

    </audio>


    <button id="musicToggle"
            class="music-toggle"
            type="button">

        🎵

    </button>


    <!-- =========================================
         FLOATING BALLOONS
    ========================================== -->

    <div class="birthday-balloon balloon-1">
        🎈
    </div>

    <div class="birthday-balloon balloon-2">
        🎈
    </div>

    <div class="birthday-balloon balloon-3">
        🎈
    </div>


    <!-- =========================================
         FLOATING HEARTS
    ========================================== -->

    <div class="birthday-heart heart-1">
        💗
    </div>

    <div class="birthday-heart heart-2">
        💗
    </div>

    <div class="birthday-heart heart-3">
        💕
    </div>


    <!-- =========================================
         FLOATING SPARKLES
    ========================================== -->

    <div class="birthday-sparkle sparkle-1">
        ✨
    </div>

    <div class="birthday-sparkle sparkle-2">
        ✨
    </div>

    <div class="birthday-sparkle sparkle-3">
        ⭐
    </div>


    <!-- =========================================
         ORIGINAL FLOATING DECORATIONS
    ========================================== -->

    <div class="confetti confetti-1">💗</div>
    <div class="confetti confetti-2">✨</div>
    <div class="confetti confetti-3">🎀</div>
    <div class="confetti confetti-4">💕</div>
    <div class="confetti confetti-5">⭐</div>
    <div class="confetti confetti-6">✨</div>
    <div class="confetti confetti-7">💗</div>
    <div class="confetti confetti-8">🎉</div>


    <!-- =========================================
         FIRST SCREEN
    ========================================== -->

    <section id="birthdayScreen"
             class="landing-screen active">

        <div class="landing-content">

            <div class="birthday-icons">
                🎉 🎂
            </div>

            <h1 class="birthday-title">
                Happy Birthday!
            </h1>

            <p class="birthday-subtitle">
                Something special has been prepared for you...
            </p>

            <div class="birthday-mini-text">
                ✨ A little surprise for you ✨
            </div>

            <button id="startButton"
                    class="main-button">

                Start Celebration 🎵

            </button>

        </div>

    </section>


    <!-- =========================================
         SECOND SCREEN
    ========================================== -->

    <section id="waitScreen"
             class="landing-screen">

        <div class="landing-content">

            <div class="wait-party">
                👀
            </div>

            <h1 class="wait-title">
                Wait... Sravuu! 😳
            </h1>

            <p class="wait-text">
                You thought that was the whole surprise?
            </p>

            <p class="small-warning">
                Unfortunately... you are about to be investigated. 🔬
            </p>

            <div class="birthday-mini-text">
                🎀 SURPRISE LEVEL: INCREASING 🎀
            </div>

            <button id="surpriseButton"
                    class="main-button">

                Of course not 😏 →

            </button>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
